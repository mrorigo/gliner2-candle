# Slop Gate policy. Missing values use warning-only defaults.
version = 1

[rules.function_mass]
severity = "warn"          # off | warn | error
new_function_limit = 80.0
delta_limit = 20.0

[rules.near_clone]
severity = "warn"          # off | warn | error
minimum_sloc = 8
minimum_tokens = 40
similarity_threshold = 0.85
max_candidates = 64

[rules.lint_suppression]
severity = "warn"

[rules.unsafe_surface]
severity = "warn"

[rules.dependency_surface]
severity = "warn"

[rules.structural_erosion]
severity = "warn"
erosion_limit = 0.50
delta_limit = 0.08
complexity_cutoff = 10
top_contributors = 3

# Add an exact-location exception only after review.
# [[suppressions]]
# rule = "near-clone"
# path = "src/compat.rs"
# line = 42
# reason = "Protocol compatibility requires this implementation."
